[server]
# Grafana is behind the gateway reverse proxy
root_url = %(protocol)s://%(domain)s/
serve_from_sub_path = false

[auth.proxy]
# Enable auth proxy — gateway authenticates and forwards X-WEBAUTH-USER
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
# Only trust the gateway container (Docker network)
whitelist = gateway
enable_login_token = false

[auth]
# Disable other auth methods when using auth proxy
disable_login_form = false
disable_signout_menu = false

[users]
auto_assign_org = true
auto_assign_org_role = Viewer

[security]
# IMPORTANT: In production, set a strong secret key via GF_SECURITY_SECRET_KEY env var
# admin_user and admin_password are set via environment variables

[log]
mode = console
level = info

[live]
# Enable Grafana Live for real-time features (WebSocket via /api/live/)
allowed_origins = *
