services:
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - GRAFANA_URL=http://grafana:3000
      - GATEWAY_LISTEN_ADDR=:8080
      - GATEWAY_AUTH_ENABLED=${GATEWAY_AUTH_ENABLED:-true}
      - GATEWAY_API_KEY_0_HASH=${GATEWAY_API_KEY_0_HASH}
      - GATEWAY_API_KEY_0_USER=${GATEWAY_API_KEY_0_USER:-admin}
      - GATEWAY_API_KEY_0_TEAM=${GATEWAY_API_KEY_0_TEAM:-platform}
      - GATEWAY_API_KEY_0_ROLES=${GATEWAY_API_KEY_0_ROLES:-admin}
      - GATEWAY_RATE_LIMIT_ENABLED=${GATEWAY_RATE_LIMIT_ENABLED:-true}
      - GATEWAY_RATE_LIMIT_RPS=${GATEWAY_RATE_LIMIT_RPS:-50}
      - GATEWAY_RATE_LIMIT_BURST=${GATEWAY_RATE_LIMIT_BURST:-100}
      - GATEWAY_AUDIT_ENABLED=${GATEWAY_AUDIT_ENABLED:-true}
      - GATEWAY_AUDIT_OUTPUT=stdout
      - GATEWAY_METRICS_ENABLED=${GATEWAY_METRICS_ENABLED:-true}
      - GATEWAY_LOG_LEVEL=${GATEWAY_LOG_LEVEL:-info}
    depends_on:
      grafana:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gateway-net

  grafana:
    image: grafana/grafana:12.3.3
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=${GATEWAY_PUBLIC_URL:-http://localhost:8080}
    # Grafana is NOT exposed to host — only accessible via gateway
    expose:
      - "3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - gateway-net

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles:
      - monitoring
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - gateway-net

volumes:
  grafana-data:
  prometheus-data:


networks:
  gateway-net:
    driver: bridge
