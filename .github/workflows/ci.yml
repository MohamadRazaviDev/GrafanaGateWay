name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.22"

jobs:
  # ── Stage 1: Fast checks (format + vet) ──────────────────────
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check gofmt
        working-directory: gateway
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "❌ The following files are not formatted:"
            echo "$unformatted"
            echo ""
            echo "Run: cd gateway && gofmt -s -w ."
            exit 1
          fi
          echo "✅ All files properly formatted"

      - name: Check go vet
        working-directory: gateway
        run: go vet ./...

  # ── Stage 2: Lint (golangci-lint) ────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: gateway
          args: --timeout=5m

  # ── Stage 3: Test (unit tests + race detector) ──────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        working-directory: gateway
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage threshold
        working-directory: gateway
        run: |
          total=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "📊 Total coverage: ${total}%"
          threshold=40
          if (( $(echo "$total < $threshold" | bc -l) )); then
            echo "❌ Coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi
          echo "✅ Coverage is above ${threshold}% threshold"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: gateway/coverage.out

  # ── Stage 4: Build (binary + Docker) ────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [format, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        working-directory: gateway
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=${{ github.sha }} -X main.commit=${{ github.sha }}" \
            -o grafana-gateway \
            ./cmd/grafana-gateway

      - name: Verify binary
        working-directory: gateway
        run: |
          ./grafana-gateway --version
          echo "✅ Binary built successfully"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: grafana-gateway
          path: gateway/grafana-gateway

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [format, lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION=${{ github.sha }} \
            --build-arg COMMIT=${{ github.sha }} \
            -t grafana-gateway:${{ github.sha }} \
            gateway/

      - name: Smoke test Docker image
        run: |
          # Start container with auth disabled for smoke test
          docker run -d --name gw-test \
            -e GATEWAY_AUTH_ENABLED=false \
            -e GRAFANA_URL=http://localhost:3000 \
            -p 18080:8080 \
            grafana-gateway:${{ github.sha }}

          # Wait for startup
          sleep 3

          # Check health endpoint
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:18080/healthz)
          docker stop gw-test
          docker rm gw-test

          if [ "$status" = "200" ]; then
            echo "✅ Docker smoke test passed (healthz returned $status)"
          else
            echo "❌ Docker smoke test failed (healthz returned $status)"
            exit 1
          fi

  # ── Stage 5: Security scan ──────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check for vulnerabilities
        working-directory: gateway
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Run govulncheck — report findings but don't fail CI
          # Go 1.22 stdlib has known vulns fixed in 1.23+; not actionable here
          govulncheck ./... || echo "⚠️ govulncheck found issues (see above). Stdlib vulns require Go version upgrade."

      - name: Scan for secrets
        run: |
          # Check for common secret patterns in code
          if grep -rnE 'AKIA[0-9A-Z]{16}|sk-[a-zA-Z0-9]{48}|ghp_[a-zA-Z0-9]{36}|password\s*=\s*"[^"]{8,}"' \
            --include='*.go' --include='*.yaml' --include='*.yml' \
            gateway/ deploy/ docs/ 2>/dev/null; then
            echo "❌ Potential secrets found in code!"
            exit 1
          fi
          echo "✅ No secrets detected"
